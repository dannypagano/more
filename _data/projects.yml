  description: Medium-format film photographs made in Monterey, CA on a roadtrip in 2021. I like to use the word "made" for capturing images, it's weightier and more artistic. It's also more pretentious.

- title: Utility Knife
  number: "009"
  url: "009/utility-knife"
  image: /assets/images/knife.jpg
  description: "Lofty: A series of 3D printed utility knives, exploring mechanical design, materials, and form. Honest: I needed a utility knife and thought it would be quick design and print one. I made a bunch that didn't work, in different shapes, multiple filament colors and materials until I thought it was cool enough."

- title: Wifi Sniffer
  number: "018"
  url: "018/wifi-sniffer"
  image: /assets/images/wifi.jpg
  description: Making the best out of a setback. — I tried to get this e-ink display working with the r-node firmware and struggled. Instead I had Claude write a little script to display information I wanted about nearby wifi networks, incorporating my ad-hoc custom UI design.

